[project]
name = "bili-digest"
version = "0.1.0"
description = "视频理解服务 - B站视频转文字摘要"
requires-python = ">=3.14"
dependencies = [
    "yt-dlp>=2024.1.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "soundfile>=0.12.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
stt = [
    "qwen-asr>=0.0.6",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "torch>=2.2.0",
]
